name: Bug report
description: Report incorrect behaviour in DNS Monitor
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a report. Please redact internal domains/IPs.
  - type: input
    id: version
    attributes:
      label: DNS Monitor version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: "Ubuntu 24.04, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command used
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour / logs
      render: shell
    validations:
      required: true
