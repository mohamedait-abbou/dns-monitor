name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check src tests
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run tests with coverage
        run: python -m pytest --cov=dns_monitor --cov-report=term-missing
      - name: Build package
        run: python -m build

  demo:
    name: Generate demo report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run deterministic simulation
        run: |
          mkdir -p out
          dns-monitor run --simulate 600 --seed 7 \
            --json out/report.json --html out/report.html \
            --markdown out/report.md --quiet --no-console-report
      - name: Verify report contents
        run: python -c "import json; d=json.load(open('out/report.json')); assert d['summary']['total_queries'] == 600; assert d['summary']['total_alerts'] > 0"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: out/
