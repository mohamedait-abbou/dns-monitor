[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-monitor"
version = "1.0.0"
description = "Real-time DNS traffic analysis and threat detection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Ait Abbou", email = "mohamedait-abbou@users.noreply.github.com" }]
keywords = ["dns", "security", "network-monitoring", "scapy", "threat-detection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "scapy>=2.5.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "flake8>=7.0",
  "ruff>=0.6",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/mohamedait-abbou/dns-monitor"
Repository = "https://github.com/mohamedait-abbou/dns-monitor"
Issues = "https://github.com/mohamedait-abbou/dns-monitor/issues"

[project.scripts]
dns-monitor = "dns_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["dns_monitor"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
